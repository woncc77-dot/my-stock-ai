services:
  - type: web
    name: my-stock-ai-api
    runtime: python
    # 한국 사용자 기준 왕복 지연을 줄이기 위해 싱가포르 리전 사용.
    # (기존 서비스의 리전 변경은 재생성이 필요할 수 있음)
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # 인증: 아래 둘 중 하나 이상 필수(미설정 시 모든 인증 요청을 503으로 거부, fail-closed).
      # 최신(ES256/RS256 서명키) 프로젝트는 SUPABASE_URL 사용(JWKS 공개키 검증).
      - key: SUPABASE_URL
        sync: false
      # 레거시(HS256 공유 시크릿) 프로젝트는 SUPABASE_JWT_SECRET 사용.
      - key: SUPABASE_JWT_SECRET
        sync: false
