name: keep-alive

# Render 무료 인스턴스가 잠들지 않도록 백엔드 헬스 엔드포인트를 주기적으로 호출합니다.
# 주의: GitHub 예약 워크플로는 지연/비활성될 수 있어, 가능하면 cron-job.org 등 외부 모니터를 함께 사용하세요.

on:
  schedule:
    # Render 무료 가동시간(월 750h) 절약: 활동 시간대에만 핑하고 새벽에는 서버를 재웁니다.
    # cron은 UTC 기준. UTC 시 + 9 = KST.
    #   활성(핑): UTC 00-15, 22, 23  => KST 07:00 ~ 다음날 01:00 (18시간)
    #   휴면(미핑): UTC 16-21         => KST 01:00 ~ 07:00 (6시간, 자동으로 sleep)
    # 10분 간격(무료 인스턴스는 15분 무요청 시 sleep되므로 그보다 짧게 유지).
    - cron: "*/10 0-15,22,23 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://my-stock-ai-api.onrender.com/ || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "health check did not return 200 after retries"
          exit 0
